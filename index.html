<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AfriFlix - African Movies</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
}

header {
    padding: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #111;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.logo span {
    color: #e50914;
}

.search {
    padding: 10px;
    border-radius: 20px;
    border: none;
    width: 45%;
}

.hero {
    padding: 70px 20px;
    background: linear-gradient(90deg, #111, #333);
}

.hero h1 {
    font-size: 38px;
    margin-bottom: 15px;
}

.hero p {
    color: #ccc;
    max-width: 500px;
    margin-bottom: 20px;
}

.watch {
    background: #e50914;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 5px;
    font-weight: bold;
}

section {
    padding: 25px 15px;
}

section h2 {
    margin-bottom: 18px;
}

.movies {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.movie {
    background: #151515;
    border-radius: 8px;
    overflow: hidden;
}

.movie img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.movie h3 {
    padding: 10px;
}

.movie p {
    padding: 0 10px 12px;
    color: #999;
    font-size: 13px;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
    background: #111;
}
</style>
</head>

<body>

<header>
    <div class="logo">Afri<span>Flix</span></div>
    <input class="search" type="text" placeholder="Search movies...">
</header>

<div class="hero">
    <h1>Welcome to AfriFlix</h1>
    <p>Discover African cinema, exciting stories and unforgettable movies.</p>
    <button class="watch">WATCH NOW</button>
</div>

<section>
    <h2>🔥 Trending Movies</h2>

    <div class="movies">

        <div class="movie">
            <img src="https://picsum.photos/300/450?random=1">
            <h3>Demo Movie One</h3>
            <p>Drama • 2026</p>
        </div>

        <div class="movie">
            <img src="https://picsum.photos/300/450?random=2">
            <h3>Demo Movie Two</h3>
            <p>Action • 2026</p>
        </div>

        <div class="movie">
            <img src="https://picsum.photos/300/450?random=3">
            <h3>Demo Movie Three</h3>
            <p>Comedy • 2026</p>
        </div>

        <div class="movie">
            <img src="https://picsum.photos/300/450?random=4">
            <h3>Demo Movie Four</h3>
            <p>Romance • 2026</p>
        </div>

    </div>
</section>

<footer>
    © 2026 AfriFlix. All rights reserved.
</footer>

</body>
</html>
